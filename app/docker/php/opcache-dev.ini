; Dev variant of zz-opcache.ini (docker-compose.override.yml mounts this over
; it for the `app` service): validate_timestamps stays on so edits to the
; bind-mounted source are picked up immediately, without a container/FPM
; restart, instead of requiring one as production's validate_timestamps=0
; would.
opcache.enable=1
opcache.enable_cli=0
opcache.validate_timestamps=1
opcache.revalidate_freq=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.jit_buffer_size=64M
opcache.jit=tracing
