# =============================================================================
#  Gym Platform — HOST nginx site (behind the Cloudflare proxy)
# =============================================================================
#
#  This file is for the nginx already installed on the server, NOT the nginx
#  inside Docker Compose (that one lives in docker/nginx/conf.d/app.conf and is
#  managed by the stack). This one listens on port 80 and proxies to the
#  container, which publishes on 127.0.0.1:801.
#
#  TLS is terminated by Cloudflare, so there is no certificate here and no
#  redirect to HTTPS. Visitors reach Cloudflare over HTTPS; Cloudflare reaches
#  this server over plain HTTP.
#
#  Install:
#      sudo cp docker/nginx/gym.nginx.conf \
#              /etc/nginx/sites-available/gym.tutomento.com
#      sudo ln -s /etc/nginx/sites-available/gym.tutomento.com \
#                 /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
#
#  Requires in the application's .env:
#      HTTP_PORT=127.0.0.1:801
#      PLATFORM_HOSTNAME=gym.tutomento.com
#      APP_URL=https://gym.tutomento.com
#
#  Cloudflare dashboard, per proxied hostname (orange cloud on):
#      SSL/TLS mode        Flexible      (see the note at the bottom)
#      Always Use HTTPS    On            (do the redirect at the edge, not here)
#
#  To add a gym's domain, edit the server_name list marked
#  "ORGANISATION DOMAINS" below. Full steps are at the bottom of this file.
#
# =============================================================================

# The visitor's real address arrives as CF-Connecting-IP; without this, every
# log line, rate limit and audit entry would record a Cloudflare address.
# Refresh from https://www.cloudflare.com/ips/ when Cloudflare publishes changes.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;

# The visitor is on HTTPS but this server is reached over HTTP, so $scheme is
# "http". Passing $scheme through would make Laravel generate http:// links and
# redirects on an https:// site. Forward what Cloudflare reports instead, and
# fall back to $scheme only if the header is absent.
map $http_x_forwarded_proto $forwarded_scheme {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# The container's published port in one place, so a change to HTTP_PORT is a
# one-line change here too. `keepalive` reuses connections between requests.
upstream gym_platform {
    server 127.0.0.1:801;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;

    server_name
        gym.tutomento.com          # admin console — set as PLATFORM_HOSTNAME
        # ---- ORGANISATION DOMAINS -------------------------------------------
        # Add each gym's hostname here, one per line, and turn the orange cloud
        # on for it in Cloudflare DNS.
        #
        # citygym.tutomento.com
        # ---------------------------------------------------------------------
        ;

    # --- Limits --------------------------------------------------------------
    # Expense receipts are capped at 5 MB by the application; nginx's own
    # default is 1 MB, which would reject them with a 413 before they arrive.
    # Cloudflare's own upload cap on the Free plan is 100 MB.
    client_max_body_size 20m;
    client_body_timeout  60s;

    # --- Logs ----------------------------------------------------------------
    access_log /var/log/nginx/gym-access.log;
    error_log  /var/log/nginx/gym-error.log warn;

    # --- Headers -------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # --- Application ---------------------------------------------------------
    location / {
        proxy_pass http://gym_platform;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # The application decides which gym a request belongs to by its
        # hostname. Forwarding nginx's own address here instead would send every
        # visitor — including the admin console — to "Organisation not found".
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;

        # Matches the container's fastcgi_read_timeout; PDF and CSV generation
        # can outrun the 60s default on a large date range. Cloudflare gives up
        # at 100s on the Free plan regardless.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Laravel emits absolute URLs already; rewriting them here would break
        # multi-domain redirects.
        proxy_redirect off;
    }

    # Compiled CSS/JS are content-hashed and the container already sends
    # immutable cache headers, so browsers and Cloudflare re-request them only
    # after a deploy. Skipping the access log keeps them out of the traffic log.
    location /build/ {
        proxy_pass http://gym_platform;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }

    # Health endpoint for uptime monitoring — returns "ok".
    location = /up {
        proxy_pass http://gym_platform;
        proxy_set_header Host $host;
        access_log off;
    }
}

# =============================================================================
#  Adding a gym's domain
# =============================================================================
#
#  1. In Cloudflare DNS add the record with the proxy ON (orange cloud):
#         citygym   A   <server IP>   Proxied
#
#  2. Add the hostname to the server_name list above.
#
#  3. Reload:
#         sudo nginx -t && sudo systemctl reload nginx
#
#  4. In the admin console at https://gym.tutomento.com, open the organisation
#     and add the hostname under Domains. Until this step the app returns
#     "Organisation not found" for it, because tenant routing reads the
#     `domains` table rather than this file.
#
#  A gym on its own domain (citygym.com rather than a subdomain) also has to be
#  added to Cloudflare as its own zone, or pointed here directly — in which case
#  it arrives unproxied over plain HTTP and needs a certificate on this server.
#
# =============================================================================
#  Two things to be aware of with Flexible SSL
# =============================================================================
#
#  * Traffic between Cloudflare and this server is unencrypted. Anyone able to
#    observe that hop sees session cookies in clear text. The fix is free and
#    takes ten minutes: generate a Cloudflare Origin Certificate, add a
#    `listen 443 ssl` block using it, and switch the SSL/TLS mode to
#    "Full (strict)". Worth doing before real member data is in the system.
#
#  * Never add an http -> https redirect to this file while the mode is
#    Flexible. Cloudflare would arrive over HTTP, get redirected to HTTPS, come
#    back over HTTP, and loop until the browser gives up. Use Cloudflare's
#    "Always Use HTTPS" setting instead, which redirects at the edge.
#
# =============================================================================
