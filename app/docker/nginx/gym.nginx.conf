# =============================================================================
#  Gym Platform — HOST nginx site
# =============================================================================
#
#  This file is for the nginx already installed on the server, NOT the nginx
#  inside Docker Compose (that one lives in docker/nginx/conf.d/app.conf and is
#  managed by the stack). This one accepts the public request and proxies it to
#  the container, which publishes on 127.0.0.1:801.
#
#  It works unchanged whether TLS is terminated here (own certificate, grey
#  cloud) or at Cloudflare (orange cloud). The scheme the visitor actually used
#  is worked out below rather than assumed, because getting it wrong is not a
#  cosmetic problem: the application builds every asset URL from it, and an
#  http:// stylesheet on an https:// page is blocked by the browser as mixed
#  content, which leaves the site unstyled and its JavaScript dead.
#
#  Install:
#      sudo cp docker/nginx/gym.nginx.conf \
#              /etc/nginx/sites-available/gym.tutomento.com
#      sudo ln -s /etc/nginx/sites-available/gym.tutomento.com \
#                 /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
#
#  Requires in the application's .env:
#      HTTP_PORT=127.0.0.1:801
#      PLATFORM_HOSTNAME=gym.tutomento.com
#      APP_URL=https://gym.tutomento.com
#
#  Only port 80 is declared here. Adding a `listen 443 ssl` block that names a
#  certificate before that certificate exists makes `nginx -t` fail, which
#  blocks the very reload certbot needs to answer the ACME challenge. Run
#  `sudo certbot --nginx -d gym.tutomento.com` and certbot adds the 443 block
#  and the http -> https redirect itself.
#
#  To add a gym's domain, edit the server_name list marked
#  "ORGANISATION DOMAINS" below. Full steps are at the bottom of this file.
#
# =============================================================================

# --- Which scheme did the visitor really use? --------------------------------
# Terminating TLS here makes $scheme correct on its own. Behind Cloudflare it is
# not: Cloudflare speaks HTTPS to the browser and plain HTTP to this server, so
# $scheme says "http" for a visitor who is on https. Cloudflare reports the real
# one in X-Forwarded-Proto, so prefer that header and fall back to $scheme only
# when no proxy set it.
#
# A direct client could set the header itself, but the worst it achieves is
# making the application address *itself* over https — there is no downgrade and
# nothing is authorised by it.
map $http_x_forwarded_proto $forwarded_scheme {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Same reasoning for the port the visitor connected to.
map $forwarded_scheme $forwarded_port {
    default $server_port;
    https   443;
    http    80;
}

# --- Cloudflare, while the orange cloud is on --------------------------------
# The visitor's real address arrives as CF-Connecting-IP; without this, every
# log line, rate limit and audit entry records a Cloudflare address instead.
# Refresh from https://www.cloudflare.com/ips/ when Cloudflare publishes changes.
#
# DELETE THIS WHOLE BLOCK if you switch the record to DNS only (grey cloud).
# With no proxy in front, it lets anything reaching this server from one of
# these networks name its own address.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;

# The container's published port in one place, so a change to HTTP_PORT is a
# one-line change here too. `keepalive` reuses connections between requests.
upstream gym_platform {
    server 127.0.0.1:801;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;

    server_name
        gym.tutomento.com          # admin console — set as PLATFORM_HOSTNAME
        # ---- ORGANISATION DOMAINS -------------------------------------------
        # Add each gym's hostname here, one per line.
        #
        # citygym.tutomento.com
        # ---------------------------------------------------------------------
        ;

    # --- Certificate renewal -------------------------------------------------
    # Declared before everything else so a renewal is never proxied to the
    # application. Harmless to keep when Cloudflare terminates TLS instead.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # --- Limits --------------------------------------------------------------
    # Expense receipts are capped at 5 MB by the application; nginx's own
    # default is 1 MB, which would reject them with a 413 before they arrive.
    client_max_body_size 20m;
    client_body_timeout  60s;

    # --- Logs ----------------------------------------------------------------
    access_log /var/log/nginx/gym-access.log;
    error_log  /var/log/nginx/gym-error.log warn;

    # --- Headers -------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # --- Application ---------------------------------------------------------
    location / {
        proxy_pass http://gym_platform;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # The application decides which gym a request belongs to by its
        # hostname. Forwarding nginx's own address here instead would send every
        # visitor — including the admin console — to "Organisation not found".
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $forwarded_port;

        # Matches the container's fastcgi_read_timeout; PDF and CSV generation
        # can outrun the 60s default on a large date range.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Laravel emits absolute URLs already; rewriting them here would break
        # multi-domain redirects.
        proxy_redirect off;
    }

    # Compiled CSS/JS are content-hashed and the container already sends
    # immutable cache headers, so browsers re-request them only after a deploy.
    # Skipping the access log keeps them out of the traffic log.
    location /build/ {
        proxy_pass http://gym_platform;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }

    # Health endpoint for uptime monitoring — returns "ok".
    location = /up {
        proxy_pass http://gym_platform;
        proxy_set_header Host $host;
        access_log off;
    }
}

# =============================================================================
#  Adding a gym's domain
# =============================================================================
#
#  1. In Cloudflare DNS add the record pointing at this server.
#
#  2. Add the hostname to the server_name list above, then:
#         sudo nginx -t && sudo systemctl reload nginx
#
#  3. If TLS is terminated here, put the hostname on the certificate. certbot
#     replaces the name list rather than adding to it, so repeat every hostname
#     the certificate already covers:
#         sudo certbot --nginx --cert-name gym.tutomento.com \
#              -d gym.tutomento.com -d citygym.tutomento.com
#
#  4. In the admin console at https://gym.tutomento.com, open the organisation
#     and add the hostname under Domains. Until this step the app returns
#     "Organisation not found" for it, because tenant routing reads the
#     `domains` table rather than this file.
#
# =============================================================================
#  Checking the scheme is being forwarded correctly
# =============================================================================
#
#  If the browser console reports blocked mixed content — an http:// stylesheet
#  on an https:// page — the application was told the request was plain HTTP.
#  Ask the stack what it received:
#
#      curl -s -o /dev/null -w '%{http_code}\n' \
#           -H 'Host: gym.tutomento.com' -H 'X-Forwarded-Proto: https' \
#           http://127.0.0.1:801/
#
#  Then confirm this file is the one actually in use, and that the directive
#  below reads $forwarded_scheme rather than $scheme:
#
#      sudo nginx -T | grep -n 'X-Forwarded-Proto'
#
# =============================================================================
